<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <script src="../funcAPIGet.js"></script>
    <title>Document</title>
</head>
<body>
    <div style="position: sticky; top: 1px;" id="header"></div>
    <div class="container">
    <!-- SIDEBAR -->
        <div class="sidebar" style="position: sticky;">
            <div class="sidebar-header">
                <p class="sidebar-kicker">Navigation</p>
                <h2 class="sidebar-title">Profit Calculators</h2>
            </div>
            <button class="sidebar-buttons" data-page="forge-profit" type="button" onclick="location.href='./forge-profit.html'">Forge Profit</button>
            <button class="sidebar-buttons" data-page="garden-profit" type="button" onclick="location.href='./garden-profit.html'">Garden Profit</button>
        </div>
        
        <!-- MAIN PAGE -->
        <main>
            <div class="forge-page-heading">
                <p class="forge-page-eyebrow">Mining Station</p>
                <h1 class="forge-page-title">Forge Profit</h1>
                <p class="forge-page-subtitle">Track the best crafts, filter by HOTM access, and sort your forge queue the way you play.</p>
            </div>
            <div class="forge-layout-card">
                <div class="forge-controls-card">
                    <div class="forge-controls-header">
                        <p class="forge-panel-kicker">Control Panel</p>
                        <h3 class="forge-controls-title">Forge Settings</h3>
                    </div>
                    <button class="forge-action-button forge-refresh-button" type="button" id="refresh-button">Refresh</button>
                    <div class="forge-top-controls">
                        <label class="forge-control-group forge-control-pill" for="hotm-select">
                            <span>HOTM Level</span>
                            <select id="hotm-select" class="forge-control-input">
                                <option value="1">HOTM 1</option>
                                <option value="2">HOTM 2</option>
                                <option value="3">HOTM 3</option>
                                <option value="4">HOTM 4</option>
                                <option value="5">HOTM 5</option>
                                <option value="6">HOTM 6</option>
                                <option value="7" selected>HOTM 7</option>
                                <option value="8">HOTM 8</option>
                                <option value="9">HOTM 9</option>
                                <option value="10">HOTM 10</option>
                            </select>
                        </label>
                        <label class="forge-checkbox-card" for="quick-forge-toggle">
                            <span class="forge-checkbox-label">Quick Forge</span>
                            <input type="checkbox" id="quick-forge-toggle">
                        </label>
                    </div>
                    <div class="forge-sort-grid">
                        <button class="forge-sort-button" type="button" data-sort="time">Shortest</button>
                        <button class="forge-sort-button" type="button" data-sort="cost">Cheapest</button>
                        <button class="forge-sort-button active" type="button" data-sort="profit">Profit</button>
                    </div>
                    <button class="forge-smart-button" type="button" data-sort="smartest">Smartest</button>
                </div>
                <div class="profit-table-card">
                    <div class="profit-table-shell">
                    <div class="profit-table-header">
                        <div class="research-tabel">Item</div>
                        <div class="research-tabel">Time</div>
                        <div class="research-tabel">Cost</div>
                        <div class="research-tabel">Profit</div>
                    </div>
                    <div class="profit-table-body" id="profit-table">
                        
                    </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
<script>
    fetch("../header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            const currentSection = "profit";
            document.querySelectorAll(".nav-btn[data-section]").forEach(button => {
                button.classList.toggle("nav-btn-active", button.dataset.section === currentSection);
            });
        });

    const currentPage = window.location.pathname.split("/").pop().replace(".html", "");
    document.querySelectorAll(".sidebar-buttons[data-page]").forEach(button => {
        button.classList.toggle("sidebar-buttons-active", button.dataset.page === currentPage);
    });

    const forge = [
        {
            itemID: "REFINED_DIAMOND",
            HOTM: 2,
            timeInMinutes: 480,
            ingredients: [
                { itemID: "ENCHANTED_DIAMOND_BLOCK", quantity: 2 }
            ]
        },
        {
            itemID: "REFINED_MITHRIL",
            HOTM: 2,
            timeInMinutes: 360,
            ingredients: [
                { itemID: "ENCHANTED_MITHRIL", quantity: 160 }
            ]
        },
        {
            itemID: "REFINED_TITANIUM",
            HOTM: 2,
            timeInMinutes: 720,
            ingredients: [
                { itemID: "ENCHANTED_TITANIUM", quantity: 16 }
            ]
        },
        {
            itemID: "REFINED_TUNGSTEN",
            HOTM: 7,
            timeInMinutes: 60,
            ingredients: [
                { itemID: "ENCHANTED_TUNGSTEN", quantity: 160 }
            ]
        },
        {
            itemID: "REFINED_UMBER",
            HOTM: 7,
            timeInMinutes: 60,
            ingredients: [
                { itemID: "ENCHANTED_UMBER", quantity: 160 }
            ]
        },
    ];

    document.getElementById("refresh-button").addEventListener("click", () => ForgeTable(true));
    document.getElementById("hotm-select").addEventListener("change", () => ForgeTable());
    document.getElementById("quick-forge-toggle").addEventListener("change", () => ForgeTable());
    document.querySelectorAll("[data-sort]").forEach(button => {
        button.addEventListener("click", () => setForgeSort(button.dataset.sort));
    });

    ForgeTable();
</script>
