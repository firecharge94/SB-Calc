<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SB Doc site</title>
</head>
<body>
    <div style="position: sticky; top: 1px;" id="header"></div>
    <main>
        <div style="margin-bottom: 50px;">
            <h1 style="color: white; text-align: center;">SkyBlock Helper</h1>
            <p style="color: white; text-align: center;">Helper site for SkyBlock Calculators and other tools.</p>
        </div>
    </main>
    
</body>
</html>
<script>
    fetch("./header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            const currentSection = "main";
            document.querySelectorAll(".nav-btn[data-section]").forEach(button => {
                button.classList.toggle("nav-btn-active", button.dataset.section === currentSection);
            });
        });
</script>
